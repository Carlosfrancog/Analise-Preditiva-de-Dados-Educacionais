name: Avisar EPA-page sobre atualizações

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      EPA_PAGE_DISPATCH_TOKEN: ${{ secrets.EPA_PAGE_DISPATCH_TOKEN }}
    steps:
      - name: Solicitar revisão de conteúdo na EPA-page
        if: ${{ env.EPA_PAGE_DISPATCH_TOKEN != '' }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${EPA_PAGE_DISPATCH_TOKEN}" \
            https://api.github.com/repos/Carlosfrancog/EPA-page/dispatches \
            -d '{"event_type":"epa-updated"}'
